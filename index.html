<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wardrobe Builder · Prototype</title><style>
:root{--ink:#1a1a1a;--muted:#929397;--line:#e9e9e9;--bg:#fff;--light:#f8f8f8;--accent:#191919;--yes:#2d8560;--no:#bb5858}*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.shell{max-width:1040px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 35px #00000009;position:relative;padding-bottom:85px}.heading{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #f4f4f4}.heading h1{font-size:24px;letter-spacing:-.6px;font-weight:600;margin:0}.iconbtn{background:transparent;border:0;font-size:22px;color:#333;min-width:32px}.toprow{display:flex;gap:12px;padding:17px 24px;align-items:center}.pill{border:1px solid #e4e4e4;border-radius:15px;background:white;padding:11px 15px;color:#444}.search{flex:1;min-width:50px;border:1px solid #eee;border-radius:14px;padding:12px;background:#fafafa;outline:none}.catbar,.subbar{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding:0 25px;border-bottom:1px solid var(--line)}.catbar::-webkit-scrollbar,.subbar::-webkit-scrollbar{display:none}.catbar button,.subbar button{border:0;background:white;color:#97979d;padding:13px 2px;font-size:17px;border-bottom:3px solid transparent}.catbar button.active{color:#161616;border-color:#161616;font-weight:600}.subbar{gap:14px}.subbar button{font-size:14px;color:#bebec4}.subbar button.active{color:#222;font-weight:600}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.tile{border:0;border-right:1px solid #e9e9e9;border-bottom:1px solid #e9e9e9;background:#fff;min-width:0;padding:8px 11px 13px;text-align:left}.tile:hover{background:#fafafa}.tile figure{height:200px;display:flex;justify-content:center;align-items:center;margin:0}.tile img{height:95%;width:95%;object-fit:contain}.tile strong{font-size:13px;font-weight:400;color:#777;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}.tile small{color:#bababa;display:block;font-size:11px;margin-top:5px}.bottomnav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);max-width:1040px;width:100%;height:76px;background:white;box-shadow:0 -1px 11px #0000000a;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #efefef}.bottomnav button{background:white;border:0;color:#96969c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.bottomnav button span{font-size:24px;line-height:26px}.bottomnav button.active{color:#111;font-weight:600}.bottomnav button small{font-size:12px}.page{padding:24px}.page h2{font-size:24px;margin:0 0 8px;letter-spacing:-.6px;font-weight:600}.hint{color:#777;line-height:1.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.primary{border:0;color:white;background:#191919;border-radius:13px;padding:12px 17px}.secondary{border:1px solid #ddd;border-radius:13px;padding:11px 16px;background:white}.stats{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}.stat{border:1px solid #e8e8e8;background:#fafafa;padding:15px;border-radius:14px;min-width:120px;flex:1}.stat b{display:block;font-size:24px}.stat small{color:#888}.trainerpair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px auto;max-width:640px}.paircard{background:#fafafa;border:1px solid #eee;border-radius:15px;text-align:center;overflow:hidden;padding:12px}.paircard img{width:100%;height:240px;object-fit:contain}.paircard strong{display:block;font-size:14px}.paircard small{color:#777}.actions{display:flex;justify-content:center;gap:12px}.actions button{font-size:15px;min-width:100px;padding:13px;border-radius:13px;border:1px solid #ddd;background:white}.actions .yes{background:#287f5b;color:white;border-color:#287f5b}.actions .no{background:#b85050;color:white;border-color:#b85050}.progress{height:6px;background:#eee;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#333;transition:width .2s}.panel{border:1px solid #e5e5e5;border-radius:14px;padding:16px;margin-top:16px}.muted{color:#777}.detailscover{display:flex;align-items:center;justify-content:center;background:#fafafa;border-radius:16px;height:280px;margin:15px 0}.detailscover img{width:90%;height:92%;object-fit:contain}.detailsrows{border-top:1px solid #eee}.detailsrow{display:grid;grid-template-columns:36% 64%;padding:13px 0;border-bottom:1px solid #f1f1f1;gap:8px}.detailsrow label{color:#818181}.detailsrow>span{overflow-wrap:anywhere}.tabs{display:flex;background:#f2f2f3;border-radius:12px;padding:4px;gap:4px}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;color:#777}.tabs button.active{background:white;color:#111;font-weight:600}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{color:#777;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;border-radius:11px;padding:12px;background:white}.modalback{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{width:100%;max-width:480px;background:white;border-radius:20px;padding:20px;max-height:90vh;overflow:auto}.modal h3{margin:0 0 14px}.graphwrap{overflow:auto;border:1px solid #eee;border-radius:15px;background:#fcfcfc;min-height:330px}.graphwrap svg{width:100%;min-width:450px}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0;color:#777}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle}.note{font-size:12px;color:#888}.empty{text-align:center;padding:55px 18px;color:#999}.tag{display:inline-block;border:1px solid #ddd;border-radius:20px;padding:5px 9px;font-size:12px;margin:3px}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}.warn{color:#a65252}.green{color:#29815e}@media(max-width:650px){.heading{height:68px;padding:0 18px}.heading h1{font-size:21px}.toprow{padding:12px 14px;gap:8px}.catbar,.subbar{padding:0 15px;gap:21px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{padding:6px 7px 11px}.tile figure{height:145px}.tile strong{font-size:11px}.page{padding:18px 15px}.paircard img{height:170px}.actions button{min-width:75px;padding:12px 9px}.bottomnav{height:72px}}
</style></head><body><div class="shell"><header class="heading"><button class="iconbtn" id="back" title="Back">‹</button><h1 id="pagetitle">All clothes</h1><button class="iconbtn" id="options" title="Data and settings">⋮</button></header><main id="main"></main><nav class="bottomnav" id="nav"></nav></div><div id="modalroot"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="seed.js"></script><script>
const WARDROBE_OCCASIONS=["Daily","Work","Date","Business","Home","Party","Sport","Special"];const WARDROBE_CATEGORIES={"Tops":["T-shirt","Tank top","Shirt","Sweatshirt","Sweater"],"Dresses":["Nightgown","Fancy","Casual"],"Pants":["Shorts","Jeans","Trousers","Track pants","Leggings","Pajama pants"],"Skirts":["Mini","Midi","Maxi"],"Outerwear":["Trench coat","Fur coat","Jacket","Cardigan","Sports jacket","Puffer jacket"],"Shoes":["Sneakers","Loafers","Flats","Heels","Sandals","Sandal heels","Boots"],"Bags":["Tote bag","Shoulder bag","Crossbody","Waist","Canvas"],"Other":["Hats","Jewelry","Underwear","Lingerie","Beachwear","Hair accessories","Scarves","Gloves","Belts"]};function subOptions(category,selected){return (WARDROBE_CATEGORIES[category]||[]).map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}function categoryOptions(selected){return Object.keys(WARDROBE_CATEGORIES).map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}const seed=window.SEED||[];const KEY='wardrobe-builder-v1';let state={items:structuredClone(seed),pairs:{},page:'wardrobe',category:'All',subcategory:'All',sort:'color',search:'',selected:null,detailTab:'info',trainerTypes:['All','All'],pairIndex:0,networkFocus:'All'};try{let s=JSON.parse(localStorage.getItem(KEY));if(s){state.items=s.items||state.items;state.pairs=s.pairs||{};}}catch(e){}function persist(){localStorage.setItem(KEY,JSON.stringify({items:state.items,pairs:state.pairs}));window.dispatchEvent(new Event('wardrobe:changed'))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pairKey(a,b){return [a,b].sort().join('::')}function val(x){return Array.isArray(x)?x.join(', '):(x==null||x===''?'—':String(x))}function image(x){return x?.image_path||''}function types(){return ['All',...Object.keys(WARDROBE_CATEGORIES)]}function nav(page){state.page=page;state.selected=null;render()}function setTitle(s){document.getElementById('pagetitle').textContent=s}function renderNav(){let data=[['wardrobe','▦','Wardrobe'],['stylist','✧','Stylist'],['add','⊕','Add Item'],['trainer','☑','Trainer'],['network','◎','Network']];document.getElementById('nav').innerHTML=data.map(([k,ic,t])=>`<button data-nav="${k}" class="${state.page===k||k==='wardrobe'&&state.page==='detail'?'active':''}"><span>${ic}</span><small>${t}</small></button>`).join('')}function render(){renderNav();const m=document.getElementById('main');if(state.page==='wardrobe')return renderWardrobe(m);if(state.page==='stylist')return window.renderStylist(m);if(state.page==='detail')return renderDetail(m);if(state.page==='trainer')return renderTrainer(m);if(state.page==='network')return renderNetwork(m);if(state.page==='add')return renderAdd(m);if(state.page==='settings')return renderSettings(m)}
function filtered(){let d=state.items.filter(x=>(state.category==='All'||x.category===state.category)&&(state.subcategory==='All'||x.subcategory===state.subcategory)&&(!state.search||[x.name,x.brand,x.category,x.subcategory,...(x.colors||[])].join(' ').toLowerCase().includes(state.search.toLowerCase())));if(state.sort==='brand')d.sort((a,b)=>(a.brand||'').localeCompare(b.brand||''));if(state.sort==='name')d.sort((a,b)=>a.name.localeCompare(b.name));if(state.sort==='color')d.sort((a,b)=>(a.colors?.[0]||'').localeCompare(b.colors?.[0]||''));return d}
function renderWardrobe(m){setTitle('All clothes');const cats=types(),sub=['All',...(state.category==='All'?[]:WARDROBE_CATEGORIES[state.category]||[])];m.innerHTML=`<div class="toprow"><input class="search" id="search" placeholder="Search wardrobe" value="${esc(state.search)}"><select class="pill" id="sort"><option value="color" ${state.sort==='color'?'selected':''}>By color</option><option value="brand" ${state.sort==='brand'?'selected':''}>By brand</option><option value="name" ${state.sort==='name'?'selected':''}>By name</option></select></div><div class="catbar">${cats.map(c=>`<button class="${state.category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="subbar">${sub.map(c=>`<button class="${state.subcategory===c?'active':''}" data-sub="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="grid">${filtered().map(x=>`<button class="tile" data-item="${esc(x.item_code)}"><figure><img src="${esc(image(x))}" alt="${esc(x.name)}"></figure><strong>${esc(x.brand||'No brand')}</strong><small>${esc(x.name)}</small></button>`).join('')}</div>${filtered().length?'':'<div class="empty">No garments match these filters.</div>'}`}
function detailRows(x,fields){return `<div class="detailsrows">${fields.map(([l,k])=>`<div class="detailsrow"><label>${l}</label><span>${esc(val(x[k]))}</span></div>`).join('')}</div>`}
function renderDetail(m){const x=state.items.find(x=>x.item_code===state.selected);if(x)x._warmth_f=x.insulation_clo_estimate==null?'—':'+'+(Number(x.insulation_clo_estimate)*25).toFixed(1)+'°F (heuristic)';if(!x){nav('wardrobe');return}setTitle('Item details');let evaluated=Object.keys(state.pairs).filter(k=>k.split('::').includes(x.item_code));m.innerHTML=`<div class="page" style="max-width:650px;margin:auto"><div class="detailscover"><img src="${esc(image(x))}" alt="${esc(x.name)}"></div><h2>${esc(x.name)}</h2><div class="tabs"><button class="${state.detailTab==='info'?'active':''}" data-detailtab="info">Info</button><button class="${state.detailTab==='weather'?'active':''}" data-detailtab="weather">Weather</button><button class="${state.detailTab==='matches'?'active':''}" data-detailtab="matches">Compatibility</button></div><div style="margin-top:15px">${state.detailTab==='info'?detailRows(x,[['ID','item_code'],['Category','category'],['Subcategory','subcategory'],['Color','colors'],['Brand','brand'],['Material','materials'],['Pattern','pattern'],['Seasons','seasons'],['Occasions','occasions'],['Details','style_tags']]):state.detailTab==='weather'?detailRows(x,[['Estimated warmth contribution (°F)','_warmth_f'],['Wind resistance (0–3)','wind_resistance'],['Water resistance (0–3)','water_resistance'],['Rain sensitivity (0–3)','wet_weather_sensitivity'],['Footwear traction (0–3)','traction_rating'],['Layering role','layering_role'],['Coverage','coverage_regions']]):`<div class="stats"><div class="stat"><b>${evaluated.filter(k=>state.pairs[k]===true).length}</b><small>Approved</small></div><div class="stat"><b>${evaluated.filter(k=>state.pairs[k]===false).length}</b><small>Rejected</small></div><div class="stat"><b>${Math.max(0,state.items.length-1-evaluated.length)}</b><small>Unreviewed*</small></div></div><p class="note">*Includes pairs that may not be appropriate to evaluate.</p><button class="secondary" data-trainitem="${esc(x.item_code)}">Train this garment</button>`}</div><div class="toolbar"><button class="primary" id="edit">Edit garment</button><button class="secondary" data-nav="wardrobe">Back to wardrobe</button></div></div>`}
function allPairs(){
 const result=[], items=state.items;
 const role=c=>c==='Tops'?'top':(['Pants','Skirts'].includes(c)?'bottom':c==='Shoes'?'shoes':c==='Outerwear'?'outer':null);
 const allowed=new Set(['bottom|top','bottom|shoes','bottom|outer']);
 for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
   let a=role(items[i].category),b=role(items[j].category);
   if(a&&b&&allowed.has([a,b].sort().join('|')))result.push([items[i],items[j]]);
 }
 return result;
}
function availablePairs(){return allPairs().filter(([a,b])=>(state.trainerTypes[0]==='All'||a.category===state.trainerTypes[0]||b.category===state.trainerTypes[0])&&(state.trainerTypes[1]==='All'||a.category===state.trainerTypes[1]||b.category===state.trainerTypes[1]))}
function renderTrainer(m){setTitle('Compatibility trainer');let p=availablePairs(),pending=p.filter(([a,b])=>!(pairKey(a.item_code,b.item_code) in state.pairs));let done=p.length-pending.length;let curr=pending[state.pairIndex%Math.max(1,pending.length)];m.innerHTML=`<section class="page"><h2>Two items. One decision.</h2><p class="hint">Only explicit Yes and No decisions are saved. Skip leaves a pair unevaluated. No outfit-level judgments.</p><div class="toolbar"><select id="traincat1" class="pill">${types().map(t=>`<option ${state.trainerTypes[0]===t?'selected':''}>${esc(t)}</option>`).join('')}</select><span style="align-self:center;color:#aaa">×</span><select id="traincat2" class="pill">${types().map(t=>`<option ${state.trainerTypes[1]===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="progress"><div style="width:${p.length?done/p.length*100:0}%"></div></div><p class="note">${done} of ${p.length} eligible comparisons reviewed · ${pending.length} remaining. Same-role alternatives are excluded.</p>${curr?`<div class="trainerpair">${curr.map(x=>`<div class="paircard"><img src="${esc(image(x))}" alt="${esc(x.name)}"><strong>${esc(x.name)}</strong><small>${esc(x.brand||'No brand')}</small></div>`).join('')}</div><div class="actions"><button class="no" data-decision="no">✕ No</button><button data-decision="skip">Skip →</button><button class="yes" data-decision="yes">✓ Yes</button></div>`:`<div class="empty"><h3>All caught up</h3><p>Every eligible pair in this filter has a recorded decision.</p></div>`}<div class="panel"><strong>Training rules</strong><p class="hint">Relationships are symmetric. Adding clothing creates new unevaluated pairs automatically. All concurrently worn pieces must have approved connections in the future Stylist.</p><button class="secondary" id="reviewDecisions">Review decisions</button></div></section>`}
function renderNetwork(m){setTitle('Compatibility network');let its=state.networkFocus==='All'?state.items:state.items.filter(x=>x.category===state.networkFocus);let approved=Object.entries(state.pairs).filter(([k,v])=>v===true).map(([k])=>k.split('::')).filter(([a,b])=>its.some(x=>x.item_code===a)&&its.some(x=>x.item_code===b));let n=its.length;let positions={};its.forEach((x,i)=>{let ang=2*Math.PI*i/Math.max(n,1)-Math.PI/2;positions[x.item_code]=[450+280*Math.cos(ang),365+255*Math.sin(ang)]});let svg=`<svg viewBox="0 0 900 740" role="img" aria-label="Approved garment links">${approved.map(([a,b])=>`<line x1="${positions[a][0]}" y1="${positions[a][1]}" x2="${positions[b][0]}" y2="${positions[b][1]}" stroke="#37835f" stroke-width="3" opacity=".75"/>`).join('')}${its.map(x=>{let [px,py]=positions[x.item_code];return `<g><circle cx="${px}" cy="${py}" r="42" fill="#fff" stroke="#dedede" stroke-width="2"/><image href="${esc(image(x))}" x="${px-36}" y="${py-36}" height="72" width="72" preserveAspectRatio="xMidYMid meet"/><text x="${px}" y="${py+56}" fill="#555" font-size="13" text-anchor="middle">${esc(x.item_code)}</text></g>`}).join('')}</svg>`;m.innerHTML=`<section class="page"><h2>Approved connections</h2><p class="hint">Each line is a saved Yes. Rejected and unevaluated relationships aren't drawn.</p><div class="toolbar"><select class="pill" id="focus">${types().map(t=>`<option ${t===state.networkFocus?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="stats"><div class="stat"><b>${its.length}</b><small>Garments</small></div><div class="stat"><b>${approved.length}</b><small>Approved connections</small></div></div><div class="graphwrap">${svg}</div><p class="note">This starter layout works best for a small group of garments. A larger network will need search, clustering, and focused garment views.</p></section>`}
function renderAdd(m){setTitle('Add garment');m.innerHTML=`<section class="page" style="max-width:600px;margin:auto"><h2>Add garment</h2><p class="hint">Manual entry for now. Items added here become eligible for new pairwise evaluations.</p><form id="addform"><div class="field"><label>Name</label><input name="name" required placeholder="e.g., Navy cashmere sweater"></div><div class="field"><label>Category</label><select name="category">${categoryOptions('Tops')}</select></div><div class="field"><label>Subcategory</label><select name="subcategory" id="addsubcategory">${subOptions('Tops','')}</select></div><div class="field"><label>Occasions</label><div class="toolbar">${WARDROBE_OCCASIONS.map(v=>`<label><input type="checkbox" name="occasions" value="${v}">${v}</label>`).join('')}</div></div><div class="field"><label>Brand</label><input name="brand"></div><div class="field"><label>Colors (comma separated)</label><input name="colors"></div><div class="field"><label>Materials (comma separated)</label><input name="materials"></div><div class="field"><label>Image</label><input type="file" name="image" accept="image/*"><small class="note">Images added through the prototype are stored in browser storage and may fill its capacity. Use original files for the production migration.</small></div><button class="primary" type="submit">Add to wardrobe</button></form></section>`}
function renderSettings(m){setTitle('Data & settings');m.innerHTML=`<section class="page"><h2>Prototype data</h2><p class="hint">This first pass works offline after files load. Changes stay in this browser's local storage; they are not yet synchronized to Supabase.</p><div class="toolbar"><button class="primary" id="export">Export garments + decisions</button><label class="secondary filebtn">Import JSON<input type="file" id="import" accept=".json,application/json"></label><button class="secondary" id="reset">Reset demo</button></div><div class="panel"><strong>Database target</strong><p class="hint">Supabase tables: <code>garments</code> and <code>compatibility</code>. Production integration will add sign-in, authorized image storage, and synchronization.</p></div></section>`}
function modal(html){document.getElementById('modalroot').innerHTML=`<div class="modalback"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalroot').innerHTML=''}function editModal(){let x=state.items.find(a=>a.item_code===state.selected);if(!x)return;modal(`<h3>Edit ${esc(x.name)}</h3><form id="editform"><div class="field"><label>Category</label><select name="category" id="editcategory">${categoryOptions(x.category)}</select></div><div class="field"><label>Subcategory</label><select name="subcategory" id="editsubcategory">${subOptions(x.category,x.subcategory)}</select></div><div class="field"><label>Occasions</label><div class="toolbar">${WARDROBE_OCCASIONS.map(v=>`<label><input type="checkbox" name="occasions" value="${v}" ${(x.occasions||[]).includes(v)?'checked':''}>${v}</label>`).join('')}</div></div>${[['name','Name'],['brand','Brand'],['colors','Colors (comma separated)'],['materials','Materials (comma separated)'],['insulation_clo_estimate','Estimated insulation (clo)'],['seasons','Seasons (comma separated)'],['wind_resistance','Wind resistance 0–3'],['water_resistance','Water resistance 0–3'],['wet_weather_sensitivity','Rain sensitivity 0–3'],['traction_rating','Sole traction 0–3'],['layering_role','Layering role']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(val(x[k])==='—'?'':val(x[k]))}"></div>`).join('')}<div class="toolbar"><button class="primary" type="submit">Save changes</button><button class="secondary" type="button" id="closemodal">Cancel</button></div></form>`)}function reviewModal(){let p=Object.entries(state.pairs);modal(`<h3>Reviewed pairs (${p.length})</h3><div style="max-height:55vh;overflow:auto">${p.map(([key,v])=>`<div class="detailsrow"><span>${esc(key.split('::').join(' ↔ '))}</span><span><select class="pill" data-pairupdate="${esc(key)}"><option value="yes" ${v===true?'selected':''}>Yes</option><option value="no" ${v===false?'selected':''}>No</option><option value="unset">Clear (unevaluated)</option></select></span></div>`).join('')||'<p class="hint">No pairs reviewed yet.</p>'}</div><button class="secondary" id="closemodal">Close</button>`)}
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.addEventListener('click',e=>{let t=e.target.closest('button,[data-item]');if(!t)return;if(t.dataset.nav){nav(t.dataset.nav);return}if(t.dataset.cat){state.category=t.dataset.cat;state.subcategory='All';render();return}if(t.dataset.sub){state.subcategory=t.dataset.sub;render();return}if(t.dataset.item){state.selected=t.dataset.item;state.detailTab='info';state.page='detail';render();return}if(t.dataset.detailtab){state.detailTab=t.dataset.detailtab;render();return}if(t.dataset.trainitem){state.trainerTypes=['All','All'];state.page='trainer';render();return}if(t.dataset.decision){let p=availablePairs().filter(([a,b])=>!(pairKey(a.item_code,b.item_code) in state.pairs));let curr=p[state.pairIndex%Math.max(1,p.length)];if(!curr)return;if(t.dataset.decision==='skip')state.pairIndex=(state.pairIndex+1)%p.length;else{state.pairs[pairKey(curr[0].item_code,curr[1].item_code)]=t.dataset.decision==='yes';state.pairIndex=0;persist()}render();return}if(t.id==='edit')editModal();if(t.id==='reviewDecisions')reviewModal();if(t.id==='closemodal')closeModal();if(t.id==='export')download('wardrobe-backup.json',JSON.stringify({version:1,items:state.items,pairs:state.pairs,exported_at:new Date().toISOString()},null,2));if(t.id==='reset'&&confirm('Reset all local changes and compatibility decisions?')){localStorage.removeItem(KEY);state.items=structuredClone(seed);state.pairs={};render()}if(t.id==='back')nav(state.page==='detail'?'wardrobe':'wardrobe');if(t.id==='options')nav('settings')});document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;let cursor=e.target.selectionStart;render();let input=document.getElementById('search');input.focus();input.setSelectionRange(cursor,cursor)}});document.addEventListener('change',e=>{let t=e.target;if(t.name==='category'&&(t.form?.id==='addform'||t.form?.id==='editform')){const sub=t.form.querySelector('[name="subcategory"]');if(sub)sub.innerHTML=subOptions(t.value,'');}if(t.id==='sort'){state.sort=t.value;render()}if(t.id==='traincat1'){state.trainerTypes[0]=t.value;state.pairIndex=0;render()}if(t.id==='traincat2'){state.trainerTypes[1]=t.value;state.pairIndex=0;render()}if(t.id==='focus'){state.networkFocus=t.value;render()}if(t.dataset.pairupdate){if(t.value==='unset')delete state.pairs[t.dataset.pairupdate];else state.pairs[t.dataset.pairupdate]=t.value==='yes';persist();reviewModal()}if(t.id==='import'){let f=t.files[0];if(!f)return;f.text().then(raw=>{try{let x=JSON.parse(raw);if(!Array.isArray(x.items)||typeof x.pairs!=='object')throw Error('Invalid format');if(confirm('Replace all locally stored wardrobe data with this backup?')){state.items=x.items;state.pairs=x.pairs;persist();closeModal();nav('wardrobe')}}catch(err){alert('Could not import: '+err.message)}})}});document.addEventListener('submit',async e=>{if(e.target.id==='editform'){e.preventDefault();let x=state.items.find(a=>a.item_code===state.selected),fd=new FormData(e.target);x.occasions=fd.getAll('occasions');fd.delete('occasions');for(let [k,v] of fd){if(['colors','materials','occasions','seasons'].includes(k))x[k]=String(v).split(',').map(a=>a.trim()).filter(Boolean);else if(['warmth_rating','insulation_clo_estimate','wind_resistance','water_resistance','wet_weather_sensitivity','traction_rating'].includes(k)){let n=Number(v);let max=k==='warmth_rating'?10:k==='insulation_clo_estimate'?100:3;x[k]=v===''?null:Math.max(0,Math.min(max,n))}else x[k]=v||null}if(x.warmth_rating!==null)x.warmth_source='user_adjusted';persist();closeModal();render();return}if(e.target.id==='addform'){e.preventDefault();let fd=new FormData(e.target);let code='NEW-'+Date.now();let it={item_code:code,name:fd.get('name'),category:fd.get('category'),subcategory:fd.get('subcategory'),brand:fd.get('brand'),colors:String(fd.get('colors')||'').split(',').map(s=>s.trim()).filter(Boolean),materials:String(fd.get('materials')||'').split(',').map(s=>s.trim()).filter(Boolean),pattern:null,seasons:[],occasions:fd.getAll('occasions'),style_tags:[],image_path:''};let f=fd.get('image');if(f&&f.size){if(f.size>1500000){alert('For this browser-only demo, please use an image under 1.5 MB.');return}it.image_path=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}state.items.push(it);try{persist()}catch(err){state.items.pop();alert('Browser storage is full. Try without the image.');return}state.category='All';state.subcategory='All';nav('wardrobe')}});document.getElementById('modalroot').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()});render();
</script><link rel="stylesheet" href="stylist.css"><script src="stylist.js"></script><script src="cloud.js"></script></body></html>
