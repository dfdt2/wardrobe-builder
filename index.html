const WARDROBE_OCCASIONS=["Daily","Work","Date","Business","Home","Party","Sport","Special"];const WARDROBE_CATEGORIES={"Tops":["T-shirt","Tank top","Shirt","Sweatshirt","Sweater"],"Dresses":["Nightgown","Fancy","Casual"],"Pants":["Shorts","Jeans","Trousers","Track pants","Leggings","Pajama pants"],"Skirts":["Mini","Midi","Maxi"],"Outerwear":["Trench coat","Fur coat","Jacket","Cardigan","Sports jacket","Puffer jacket"],"Shoes":["Sneakers","Loafers","Flats","Heels","Sandals","Sandal heels","Boots"],"Bags":["Tote bag","Shoulder bag","Crossbody","Waist","Canvas"],"Other":["Hats","Jewelry","Underwear","Lingerie","Beachwear","Hair accessories","Scarves","Gloves","Belts"]};function subOptions(category,selected){return (WARDROBE_CATEGORIES[category]||[]).map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}function categoryOptions(selected){return Object.keys(WARDROBE_CATEGORIES).map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}const seed=window.SEED||[];const KEY='wardrobe-builder-v1';let state={items:structuredClone(seed),pairs:{},page:'wardrobe',category:'All',subcategory:'All',sort:'color',filtersOpen:false,search:'',selected:null,detailTab:'info',trainerTypes:['All','All'],pairIndex:0,networkFocus:'All'};try{let s=JSON.parse(localStorage.getItem(KEY));if(s){state.items=s.items||state.items;state.pairs=s.pairs||{};}}catch(e){}function persist(){localStorage.setItem(KEY,JSON.stringify({items:state.items,pairs:state.pairs}));window.dispatchEvent(new Event('wardrobe:changed'))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pairKey(a,b){return [a,b].sort().join('::')}function val(x){return Array.isArray(x)?x.join(', '):(x==null||x===''?'—':String(x))}function image(x){return x?.image_path||''}function types(){return ['All',...Object.keys(WARDROBE_CATEGORIES)]}function nav(page){state.page=page;state.selected=null;render()}function setTitle(s){document.getElementById('pagetitle').textContent=s}function navIcon(k){const paths={"wardrobe":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M9 3v18\"/>","stylist":"<path d=\"m12 3 1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9L12 3Z\"/><path d=\"m19 19 1 2m-2-1 2-1\"/>","network":"<circle cx=\"6\" cy=\"6\" r=\"2\"/><circle cx=\"18\" cy=\"6\" r=\"2\"/><circle cx=\"12\" cy=\"18\" r=\"2\"/><path d=\"m8 7 3 9m5-9-3 9M8 6h8\"/>","trainer":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"m7.5 12 3 3 6-7\"/>","add":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v8M8 12h8\"/>","settings":"<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1\"/>"};return `<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[k]||''}</svg>`}function renderNav(){let data=[['wardrobe','▦','Wardrobe'],['stylist','✧','Stylist'],['network','◎','Network'],['trainer','☑','Trainer'],['add','⊕','Add Item'],['settings','⚙','Settings']];document.getElementById('nav').innerHTML=data.map(([k,ic,t])=>`<button data-nav="${k}" class="${state.page===k||k==='wardrobe'&&state.page==='detail'?'active':''}"><span class="navicon">${navIcon(k)}</span><small>${t}</small></button>`).join('')}function render(){renderNav();const m=document.getElementById('main');if(state.page==='wardrobe')return renderWardrobe(m);if(state.page==='stylist')return window.renderStylist(m);if(state.page==='detail')return renderDetail(m);if(state.page==='trainer')return renderTrainer(m);if(state.page==='network')return renderNetwork(m);if(state.page==='add')return renderAdd(m);if(state.page==='settings')return renderSettings(m)}
const COLOR_PALETTE={"White":"#ffffff","Ivory":"#f5f0de","Beige":"#dfd6bf","Light-Gray":"#c8c8c8","Dark-Gray":"#77787c","Black":"#202020","Light-Yellow":"#f0e8a2","Yellow":"#e7d65a","Turmeric":"#d9a52d","Orange":"#d98d48","Coral":"#d98772","Red":"#bb4548","Pink":"#e8b5c1","Hot-Pink":"#d971a1","Light-Green":"#9ecb95","Green":"#4f9664","Olive":"#8c8b43","Dark-Olive":"#596d46","Teal":"#488e8e","Khaki":"#b6a16e","Cyan":"#63bdc0","Sky-Blue":"#91c1dc","Blue":"#547bbd","Navy":"#303f76","Lavender":"#b7afd6","Purple":"#85609c","Burgundy":"#873950","Camel":"#b18a68","Brown":"#8e6150","Dark-Brown":"#614637","Magenta":"#bf6a9a","Gold":"#c8a654","Silver":"#b3b6ba"};

const COLOR_ALIASES={"light gray":"Light-Gray","light grey":"Light-Gray","light-gray":"Light-Gray","light-grey":"Light-Gray","dark gray":"Dark-Gray","dark grey":"Dark-Gray","dark-gray":"Dark-Gray","dark-grey":"Dark-Gray","gray":"Light-Gray","grey":"Light-Gray","charcoal":"Dark-Gray","charcoal gray":"Dark-Gray","off white":"Ivory","off-white":"Ivory","cream":"Ivory","tan":"Beige","navy blue":"Navy","dark blue":"Navy","light blue":"Sky-Blue","sky blue":"Sky-Blue","hot pink":"Hot-Pink","hot-pink":"Hot-Pink","fuchsia":"Magenta","wine":"Burgundy","wine red":"Burgundy","maroon":"Burgundy","olive green":"Olive","dark olive":"Dark-Olive","dark olive green":"Dark-Olive","forest green":"Green","dark green":"Green","light green":"Light-Green","mint":"Light-Green","turquoise":"Teal","aqua":"Cyan","mustard":"Turmeric","multi":"Colorful","multicolor":"Colorful","multi-color":"Colorful","colourful":"Colorful"};
function canonicalColor(value){const raw=String(value||'').trim().toLowerCase().replace(/_/g,' ').replace(/\s+/g,' ');return COLOR_ALIASES[raw]||COLOR_ORDER.find(c=>c.toLowerCase()===raw)||null;}

const filterSections=[['season','Season'],['color','Color'],['occasion','Occasions'],['material','Material'],['pattern','Pattern'],['brand','Brand']];
const filterExpanded={season:true,color:false,occasion:true,material:false,pattern:false,brand:false};
function filterFieldValues(x,field){const v=x[field==='color'?'colors':field==='occasion'?'occasions':field==='season'?'seasons':field==='material'?'materials':field];return (Array.isArray(v)?v:[v]).filter(z=>z!=null&&String(z).trim()).map(String)}
function filterChip(field,value){const selected=wardrobeFilters[field].includes(value);const swatch=field==='color'?'<i class="filter-swatch" style="background:'+esc(colorCss(value))+'"></i>':'';return '<button type="button" class="filter-chip '+(selected?'selected':'')+'" data-filter-chip="'+esc(field)+'" data-filter-value="'+esc(value)+'" aria-pressed="'+selected+'">'+swatch+esc(value)+'</button>'}
function filterSheet(){return '<div class="filter-overlay" id="filter-overlay"><section class="filter-sheet" role="dialog" aria-modal="true" aria-label="Wardrobe filters"><div class="filter-handle"></div><header class="filter-heading"><button type="button" id="filter-close" aria-label="Close filters">×</button><h2>Filter</h2></header><div class="filter-scroll">'+filterSections.map(([field,title])=>'<section class="filter-section"><button type="button" class="filter-section-title" data-filter-expand="'+field+'" aria-expanded="'+filterExpanded[field]+'"><span>'+title+'</span><span class="filter-chevron">'+(filterExpanded[field]?'⌃':'⌄')+'</span></button>'+(filterExpanded[field]?'<div class="filter-chip-wrap">'+(field==='color'?COLOR_ORDER:filterOptions(field)).map(v=>filterChip(field,v)).join('')+(field==='color'?'':filterChip(field,'Not set'))+'</div>':'')+'</section>').join('')+'</div><footer class="filter-footer"><button type="button" id="clearfilters">Clear</button><button type="button" id="filter-done">Done</button></footer></section></div>'}
function refreshFilterSheet(){const old=document.getElementById('filter-overlay');if(!old)return;const scroll=old.querySelector('.filter-scroll')?.scrollTop||0;old.outerHTML=filterSheet();document.querySelector('.filter-scroll').scrollTop=scroll}
function closeFilterSheet(){state.filtersOpen=false;document.getElementById('filter-overlay')?.remove();document.body.classList.remove('filter-open')}

function filterOptions(field){const values=new Set();for(const x of state.items){const v=x[field==='color'?'colors':field==='occasion'?'occasions':field==='season'?'seasons':field==='material'?'materials':field];for(const item of (Array.isArray(v)?v:[v]))if(item!=null&&String(item).trim())values.add(String(item));}return [...values].filter(v=>field!=='color'||!['colorful','colourful','multicolor','multi-color','multi'].includes(v.trim().toLowerCase())).sort((a,b)=>field==='color'?(colorRank(a)-colorRank(b)||a.localeCompare(b)):a.localeCompare(b));}
function filtered(){let d=state.items.filter(x=>{
if(state.category!=='All'&&x.category!==state.category)return false;
if(state.subcategory!=='All'&&x.subcategory!==state.subcategory)return false;
return Object.entries(wardrobeFilters).every(([field,choices])=>!choices.length||choices.some(choice=>{const values=filterFieldValues(x,field);return choice==='Not set'?!values.length:values.some(v=>field==='color'?canonicalColor(v)===choice||v.toLowerCase()===choice.toLowerCase():v.toLowerCase()===choice.toLowerCase())}));
});
const order=Object.keys(WARDROBE_CATEGORIES);const text=(a,b)=>String(a||'').localeCompare(String(b||''));
if(state.sort==='category')d.sort((a,b)=>order.indexOf(a.category)-order.indexOf(b.category)||text(a.subcategory,b.subcategory)||text(a.name,b.name));
else if(state.sort==='recent')d.sort((a,b)=>{const date=v=>Date.parse(v.created_at||'')||0;return date(b)-date(a)||text(b.item_code,a.item_code);});
else d.sort((a,b)=>colorRank(a.colors?.[0])-colorRank(b.colors?.[0])||text(a.colors?.[0],b.colors?.[0])||text(a.name,b.name));

function renderWardrobe(m){

function colorCss(value){const canonical=canonicalColor(value);if(canonical)return COLOR_PALETTE[canonical];const raw=String(value||'').trim();if(/^#[0-9a-f]{3,8}$/i.test(raw))return raw;return '#c0c0c0';}
function colorSwatches(x){const colors=Array.isArray(x.colors)?x.colors:[x.colors];return '<span style="display:inline-flex;gap:7px;flex-wrap:wrap;justify-content:flex-end">'+colors.filter(Boolean).map(c=>`<span title="${esc(c)}" aria-label="${esc(c)}" role="img" style="display:inline-block;width:24px;height:24px;flex:none;border:1px solid #b6b6b6;border-radius:50%;background:${colorCss(c)}"></span>`).join('')+'</span>'}
function estimatedClo(x){if(x.insulation_clo_estimate!==null&&x.insulation_clo_estimate!==undefined&&x.insulation_clo_estimate!==''&&Number.isFinite(Number(x.insulation_clo_estimate)))return Number(x.insulation_clo_estimate);
const values={'t-shirt':.08,'tank top':.05,'shirt':.20,'sweatshirt':.34,'sweater':.30,'nightgown':.20,'fancy':.28,'casual':.24,'shorts':.06,'jeans':.24,'trousers':.24,'track pants':.26,'leggings':.13,'pajama pants':.22,'mini':.12,'midi':.16,'maxi':.22,'trench coat':.40,'fur coat':.65,'jacket':.32,'cardigan':.28,'sports jacket':.30,'puffer jacket':.70,'sneakers':.03,'loafers':.02,'flats':.02,'heels':.02,'sandals':.01,'sandal heels':.01,'boots':.05};
const sub=String(x.subcategory||'').toLowerCase(),wool=(x.materials||[]).some(m=>/wool|cashmere|alpaca|mohair/i.test(m)),bonus=wool&&['trench coat','jacket','sweater','cardigan','sports jacket','trousers','shirt'].includes(sub)?.05:0;
return Math.round(Math.min(1.2,(values[sub]??(x.category==='Other'?.04:.12))+bonus)*1000)/1000;}
function detailRows(x,fields){return `<div class="detailsrows">${fields.map(([l,k])=>`<div class="detailsrow"><label>${l}</label><span>${k==='colors'?colorSwatches(x):esc(val(x[k]))}</span></div>`).join('')}</div>`}
function compatibilityCard(item){return `<button class="paircard" data-item="${esc(item.item_code)}" style="border:1px solid #eee;cursor:pointer;padding:8px"><img src="${esc(image(item))}" alt="${esc(item.name)}" style="height:125px;width:100%;object-fit:contain"><strong style="font-size:12px;line-height:1.3;margin-top:5px">${esc(item.name)}</strong></button>`;}
function renderDetail(m){
 const x=state.items.find(item=>item.item_code===state.selected);
 if(!x){nav('wardrobe');return;}
 x._display_clo=estimatedClo(x).toFixed(3);x._warmth_f='+'+(estimatedClo(x)*25).toFixed(2)+'°F (estimate)';
 setTitle('Item details');
 // Use the exact same eligibility rules as the compatibility trainer.
 const eligible=allPairs().filter(([a,b])=>a.item_code===x.item_code||b.item_code===x.item_code);
 const grouped={approved:[],rejected:[],unreviewed:[]};
 for(const [a,b] of eligible){
   const other=a.item_code===x.item_code?b:a;
   const key=pairKey(a.item_code,b.item_code);
   if(state.pairs[key]===true)grouped.approved.push(other);
   else if(state.pairs[key]===false)grouped.rejected.push(other);
   else grouped.unreviewed.push(other);
 }
 const gallery=(label,items)=>`<section style="margin:22px 0"><h3 style="font-size:16px;margin:0 0 10px">${label} (${items.length})</h3>${items.length?`<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${items.map(compatibilityCard).join('')}</div>`:'<p class="hint" style="margin:0">None</p>'}</section>`;
 const matches=`<div class="stats"><div class="stat"><b>${grouped.approved.length}</b><small>Approved</small></div><div class="stat"><b>${grouped.rejected.length}</b><small>Rejected</small></div><div class="stat"><b>${grouped.unreviewed.length}</b><small>Unreviewed eligible pairs</small></div></div>${gallery('Approved',grouped.approved)}${gallery('Rejected',grouped.rejected)}${grouped.unreviewed.length?gallery('Unreviewed',grouped.unreviewed):''}<button class="secondary" data-trainitem="${esc(x.item_code)}">Open compatibility trainer</button>`;
 m.innerHTML=`<div class="page" style="max-width:650px;margin:auto"><button class="secondary" data-nav="wardrobe" style="margin-bottom:12px">← Back to wardrobe</button><div class="detailscover"><img src="${esc(image(x))}" alt="${esc(x.name)}"></div><h2>${esc(x.name)}</h2><div class="tabs"><button class="${state.detailTab==='info'?'active':''}" data-detailtab="info">Info</button><button class="${state.detailTab==='weather'?'active':''}" data-detailtab="weather">Weather</button><button class="${state.detailTab==='matches'?'active':''}" data-detailtab="matches">Compatibility</button></div><div style="margin-top:15px">${state.detailTab==='info'?detailRows(x,[['Category','category'],['Subcategory','subcategory'],['Color','colors'],['Brand','brand'],['Material','materials'],['Pattern','pattern'],['Seasons','seasons'],['Occasions','occasions'],['Details','style_tags']]):state.detailTab==='weather'?detailRows(x,[['Insulation (clo)','_display_clo'],['Estimated warmth contribution (°F)','_warmth_f']]):matches}</div><div class="toolbar"><button class="primary" id="edit">Edit garment</button></div></div>`;
}
function allPairs(){
 const result=[], items=state.items;
 const role=c=>c==='Tops'?'top':(['Pants','Skirts'].includes(c)?'bottom':c==='Shoes'?'shoes':c==='Outerwear'?'outer':null);
 const allowed=new Set(['bottom|top','bottom|shoes','bottom|outer']);
 for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
   let a=role(items[i].category),b=role(items[j].category);
   if(a&&b&&allowed.has([a,b].sort().join('|')))result.push([items[i],items[j]]);
 }
 return result;
}
function availablePairs(){return allPairs().filter(([a,b])=>(state.trainerTypes[0]==='All'||a.category===state.trainerTypes[0]||b.category===state.trainerTypes[0])&&(state.trainerTypes[1]==='All'||a.category===state.trainerTypes[1]||b.category===state.trainerTypes[1]))}
function renderTrainer(m){setTitle('Compatibility trainer');let p=availablePairs(),pending=p.filter(([a,b])=>!(pairKey(a.item_code,b.item_code) in state.pairs));let done=p.length-pending.length;let curr=pending[state.pairIndex%Math.max(1,pending.length)];m.innerHTML=`<section class="page"><h2>Two items. One decision.</h2><p class="hint">Only explicit Yes and No decisions are saved. Skip leaves a pair unevaluated. No outfit-level judgments.</p><div class="toolbar"><select id="traincat1" class="pill">${types().map(t=>`<option ${state.trainerTypes[0]===t?'selected':''}>${esc(t)}</option>`).join('')}</select><span style="align-self:center;color:#aaa">×</span><select id="traincat2" class="pill">${types().map(t=>`<option ${state.trainerTypes[1]===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="progress"><div style="width:${p.length?done/p.length*100:0}%"></div></div><p class="note">${done} of ${p.length} eligible comparisons reviewed · ${pending.length} remaining. Same-role alternatives are excluded.</p>${curr?`<div class="trainerpair">${curr.map(x=>`<div class="paircard"><img src="${esc(image(x))}" alt="${esc(x.name)}"><strong>${esc(x.name)}</strong><small>${esc(x.brand||'No brand')}</small></div>`).join('')}</div><div class="actions"><button class="no" data-decision="no">✕ No</button><button data-decision="skip">Skip →</button><button class="yes" data-decision="yes">✓ Yes</button></div>`:`<div class="empty"><h3>All caught up</h3><p>Every eligible pair in this filter has a recorded decision.</p></div>`}<div class="panel"><strong>Training rules</strong><p class="hint">Relationships are symmetric. Adding clothing creates new unevaluated pairs automatically. All concurrently worn pieces must have approved connections in the future Stylist.</p><button class="secondary" id="reviewDecisions">Review decisions</button></div></section>`}
function renderNetwork(m){setTitle('Compatibility network');let its=state.networkFocus==='All'?state.items:state.items.filter(x=>x.category===state.networkFocus);let approved=Object.entries(state.pairs).filter(([k,v])=>v===true).map(([k])=>k.split('::')).filter(([a,b])=>its.some(x=>x.item_code===a)&&its.some(x=>x.item_code===b));let n=its.length;let positions={};its.forEach((x,i)=>{let ang=2*Math.PI*i/Math.max(n,1)-Math.PI/2;positions[x.item_code]=[450+280*Math.cos(ang),365+255*Math.sin(ang)]});let svg=`<svg viewBox="0 0 900 740" role="img" aria-label="Approved garment links">${approved.map(([a,b])=>`<line x1="${positions[a][0]}" y1="${positions[a][1]}" x2="${positions[b][0]}" y2="${positions[b][1]}" stroke="#37835f" stroke-width="3" opacity=".75"/>`).join('')}${its.map(x=>{let [px,py]=positions[x.item_code];return `<g><circle cx="${px}" cy="${py}" r="42" fill="#fff" stroke="#dedede" stroke-width="2"/><image href="${esc(image(x))}" x="${px-36}" y="${py-36}" height="72" width="72" preserveAspectRatio="xMidYMid meet"/><text x="${px}" y="${py+56}" fill="#555" font-size="13" text-anchor="middle">${esc(x.item_code)}</text></g>`}).join('')}</svg>`;m.innerHTML=`<section class="page"><h2>Approved connections</h2><p class="hint">Each line is a saved Yes. Rejected and unevaluated relationships aren't drawn.</p><div class="toolbar"><select class="pill" id="focus">${types().map(t=>`<option ${t===state.networkFocus?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="stats"><div class="stat"><b>${its.length}</b><small>Garments</small></div><div class="stat"><b>${approved.length}</b><small>Approved connections</small></div></div><div class="graphwrap">${svg}</div><p class="note">This starter layout works best for a small group of garments. A larger network will need search, clustering, and focused garment views.</p></section>`}
function renderAdd(m){setTitle('Add garment');m.innerHTML=`<section class="page" style="max-width:600px;margin:auto"><h2>Add garment</h2><p class="hint">Manual entry for now. Items added here become eligible for new pairwise evaluations.</p><form id="addform"><div class="field"><label>Name</label><input name="name" required placeholder="e.g., Navy cashmere sweater"></div><div class="field"><label>Category</label><select name="category">${categoryOptions('Tops')}</select></div><div class="field"><label>Subcategory</label><select name="subcategory" id="addsubcategory">${subOptions('Tops','')}</select></div><div class="field"><label>Occasions</label><div class="toolbar">${WARDROBE_OCCASIONS.map(v=>`<label><input type="checkbox" name="occasions" value="${v}">${v}</label>`).join('')}</div></div><div class="field"><label>Brand</label><input name="brand"></div><div class="field"><label>Colors (comma separated)</label><input name="colors"></div><div class="field"><label>Materials (comma separated)</label><input name="materials"></div><div class="field"><label>Image</label><input type="file" name="image" accept="image/*"><small class="note">Images added through the prototype are stored in browser storage and may fill its capacity. Use original files for the production migration.</small></div><button class="primary" type="submit">Add to wardrobe</button></form></section>`}
function renderSettings(m){setTitle('Data & settings');m.innerHTML=`<section class="page"><h2>Wardrobe data</h2><p class="hint">Your wardrobe is stored in Supabase when signed in and synchronized. Export a local backup before replacing local data.</p><div class="toolbar"><button class="primary" id="export">Export garments + decisions</button><label class="secondary filebtn">Import JSON<input type="file" id="import" accept=".json,application/json"></label><button class="secondary" id="reset">Reset demo</button></div><div class="panel"><strong>Cloud storage</strong><p class="hint">Your production database uses Supabase tables <code>garments</code> and <code>compatibility</code>. Sign in and use “Load cloud data” in the Supabase connection section below to retrieve changes made outside this browser.</p></div></section>`}
function modal(html){document.getElementById('modalroot').innerHTML=`<div class="modalback"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalroot').innerHTML=''}function editModal(){let x=state.items.find(a=>a.item_code===state.selected);if(!x)return;modal(`<h3>Edit ${esc(x.name)}</h3><form id="editform"><div class="field"><label>Category</label><select name="category" id="editcategory">${categoryOptions(x.category)}</select></div><div class="field"><label>Subcategory</label><select name="subcategory" id="editsubcategory">${subOptions(x.category,x.subcategory)}</select></div><div class="field"><label>Occasions</label><div class="toolbar">${WARDROBE_OCCASIONS.map(v=>`<label><input type="checkbox" name="occasions" value="${v}" ${(x.occasions||[]).includes(v)?'checked':''}>${v}</label>`).join('')}</div></div>${[['name','Name'],['brand','Brand'],['colors','Colors (comma separated)'],['materials','Materials (comma separated)'],['insulation_clo_estimate','Estimated insulation (clo)'],['seasons','Seasons (comma separated)'],].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(k==='insulation_clo_estimate'?estimatedClo(x).toFixed(3):(val(x[k])==='—'?'':val(x[k])))}"></div>`).join('')}<div class="toolbar"><button class="primary" type="submit">Save changes</button><button class="secondary" type="button" id="closemodal">Cancel</button></div></form>`)}function reviewModal(){let p=Object.entries(state.pairs);modal(`<h3>Reviewed pairs (${p.length})</h3><div style="max-height:55vh;overflow:auto">${p.map(([key,v])=>`<div class="detailsrow"><span>${esc(key.split('::').join(' ↔ '))}</span><span><select class="pill" data-pairupdate="${esc(key)}"><option value="yes" ${v===true?'selected':''}>Yes</option><option value="no" ${v===false?'selected':''}>No</option><option value="unset">Clear (unevaluated)</option></select></span></div>`).join('')||'<p class="hint">No pairs reviewed yet.</p>'}</div><button class="secondary" id="closemodal">Close</button>`)}
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.addEventListener('click',e=>{let t=e.target.closest('button,[data-item]');if(!t)return;if(t.dataset.nav){nav(t.dataset.nav);return}if(t.dataset.cat){state.category=t.dataset.cat;state.subcategory='All';render();return}if(t.dataset.sub){state.subcategory=t.dataset.sub;render();return}if(t.dataset.item){state.selected=t.dataset.item;state.detailTab='info';state.page='detail';render();return}if(t.dataset.detailtab){state.detailTab=t.dataset.detailtab;render();return}if(t.dataset.trainitem){state.trainerTypes=['All','All'];state.page='trainer';render();return}if(t.dataset.decision){let p=availablePairs().filter(([a,b])=>!(pairKey(a.item_code,b.item_code) in state.pairs));let curr=p[state.pairIndex%Math.max(1,p.length)];if(!curr)return;if(t.dataset.decision==='skip')state.pairIndex=(state.pairIndex+1)%p.length;else{state.pairs[pairKey(curr[0].item_code,curr[1].item_code)]=t.dataset.decision==='yes';state.pairIndex=0;persist()}render();return}if(t.id==='togglefilters'){state.filtersOpen=true;render();document.body.classList.add('filter-open');return}if(t.id==='filter-close'||t.id==='filter-done'){closeFilterSheet();render();return}if(t.id==='clearfilters'){for(const k in wardrobeFilters)wardrobeFilters[k]=[];closeFilterSheet();render();return}if(t.dataset.filterExpand){filterExpanded[t.dataset.filterExpand]=!filterExpanded[t.dataset.filterExpand];refreshFilterSheet();return}if(t.dataset.filterChip){const a=wardrobeFilters[t.dataset.filterChip],v=t.dataset.filterValue;const i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);refreshFilterSheet();return}if(t.id==='edit')editModal();if(t.id==='reviewDecisions')reviewModal();if(t.id==='closemodal')closeModal();if(t.id==='export')download('wardrobe-backup.json',JSON.stringify({version:1,items:state.items,pairs:state.pairs,exported_at:new Date().toISOString()},null,2));if(t.id==='reset'&&confirm('Reset all local changes and compatibility decisions?')){localStorage.removeItem(KEY);state.items=structuredClone(seed);state.pairs={};render()}if(t.id==='back')nav(state.page==='detail'?'wardrobe':'wardrobe');if(t.id==='options')nav('settings')});document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;let cursor=e.target.selectionStart;render();let input=document.getElementById('search');input.focus();input.setSelectionRange(cursor,cursor)}});document.addEventListener('change',e=>{let t=e.target;if(t.name==='category'&&(t.form?.id==='addform'||t.form?.id==='editform')){const sub=t.form.querySelector('[name="subcategory"]');if(sub)sub.innerHTML=subOptions(t.value,'');}if(t.id==='sort'){state.sort=t.value;render()}if(t.id==='traincat1'){state.trainerTypes[0]=t.value;state.pairIndex=0;render()}if(t.id==='traincat2'){state.trainerTypes[1]=t.value;state.pairIndex=0;render()}if(t.id==='focus'){state.networkFocus=t.value;render()}if(t.dataset.pairupdate){if(t.value==='unset')delete state.pairs[t.dataset.pairupdate];else state.pairs[t.dataset.pairupdate]=t.value==='yes';persist();reviewModal()}if(t.id==='import'){let f=t.files[0];if(!f)return;f.text().then(raw=>{try{let x=JSON.parse(raw);if(!Array.isArray(x.items)||typeof x.pairs!=='object')throw Error('Invalid format');if(confirm('Replace all locally stored wardrobe data with this backup?')){state.items=x.items;state.pairs=x.pairs;persist();closeModal();nav('wardrobe')}}catch(err){alert('Could not import: '+err.message)}})}});document.addEventListener('submit',async e=>{if(e.target.id==='editform'){e.preventDefault();let x=state.items.find(a=>a.item_code===state.selected),fd=new FormData(e.target);x.occasions=fd.getAll('occasions');fd.delete('occasions');for(let [k,v] of fd){if(['colors','materials','occasions','seasons'].includes(k))x[k]=String(v).split(',').map(a=>a.trim()).filter(Boolean);else if(['warmth_rating','insulation_clo_estimate','wind_resistance','water_resistance','wet_weather_sensitivity','traction_rating'].includes(k)){let n=Number(v);let max=k==='warmth_rating'?10:k==='insulation_clo_estimate'?100:3;x[k]=v===''?null:Math.max(0,Math.min(max,n))}else x[k]=v||null}persist();closeModal();render();return}if(e.target.id==='addform'){e.preventDefault();let fd=new FormData(e.target);let code='NEW-'+Date.now();let it={item_code:code,name:fd.get('name'),category:fd.get('category'),subcategory:fd.get('subcategory'),brand:fd.get('brand'),colors:String(fd.get('colors')||'').split(',').map(s=>s.trim()).filter(Boolean),materials:String(fd.get('materials')||'').split(',').map(s=>s.trim()).filter(Boolean),pattern:null,seasons:[],occasions:fd.getAll('occasions'),style_tags:[],image_path:''};let f=fd.get('image');if(f&&f.size){if(f.size>1500000){alert('For this browser-only demo, please use an image under 1.5 MB.');return}it.image_path=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}state.items.push(it);try{persist()}catch(err){state.items.pop();alert('Browser storage is full. Try without the image.');return}state.category='All';state.subcategory='All';nav('wardrobe')}});document.getElementById('modalroot').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()});render();
</script><link rel="stylesheet" href="stylist.css"><script src="stylist.js"></script><script src="cloud.js?v=20261024-3"></script></body></html>
